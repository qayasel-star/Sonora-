name: Compilar Sonora Music APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de depuracion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle || test -f settings.gradle.kts || { echo "ERROR: falta settings.gradle"; exit 1; }
          test -f app/build.gradle || test -f app/build.gradle.kts || { echo "ERROR: falta app/build.gradle"; exit 1; }
          echo "Proyecto Android encontrado en la raiz del repositorio."

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Verificar APK generada
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Gradle terminó pero no se encontró $APK"
            find app/build/outputs -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
