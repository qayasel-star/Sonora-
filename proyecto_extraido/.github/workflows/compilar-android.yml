
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto Android
        id: proyecto
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontro settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Comprobar Gradle Wrapper
        working-directory: ${{ steps.proyecto.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "No existe gradlew. Se intentara generar."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "ERROR: Gradle no esta instalado."
              exit 1
            fi

            gradle wrapper
          fi

          chmod +x gradlew

      - name: Compilar APK Debug
        working-directory: ${{ steps.proyecto.outputs.dir }}
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-android-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
